<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Citas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Formulario de Citas</h1>
    <form id="appointmentForm">
        <div class="form-group">
            <label for="client_name">Nombre del Cliente:</label>
            <input type="text" id="client_name" name="client_name" required>
        </div>
        
        <div class="form-group">
            <label for="date">Fecha:</label>
            <input type="date" id="date" name="date" required>
        </div>
        
        <div class="form-group">
            <label for="time">Hora:</label>
            <input type="time" id="time" name="time" required>
        </div>
        
        <div class="form-group">
            <label for="service_type">Tipo de Servicio:</label>
            <select id="service_type" name="service_type" required>
                <option value="">Seleccione un servicio</option>
                <option value="Consulta médica">Consulta médica</option>
                <option value="Revisión general">Revisión general</option>
                <option value="Vacunación">Vacunación</option>
                <option value="Tratamiento especializado">Tratamiento especializado</option>
                <option value="Otro">Otro</option>
            </select>
        </div>
        
        <button type="submit">Crear Cita</button>
    </form>
    
    <div id="message"></div>

    <script>
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                client_name: document.getElementById('client_name').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                service_type: document.getElementById('service_type').value
            };
            
            try {
                const response = await fetch('http://localhost:3000/appointments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                const messageDiv = document.getElementById('message');
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Cita creada exitosamente: ' + result.appointment.id;
                    document.getElementById('appointmentForm').reset();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = `Error ${response.status}: ${result.error || result.message || 'Ocurrió un error al crear la cita'}`;
                }
            } catch (error) {
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Error de red: ' + error.message;
            }
        });
    </script>
</body>
</html>
